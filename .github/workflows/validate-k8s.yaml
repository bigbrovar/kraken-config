---
name: Validate Kubernetes Manifests
'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # CHECK 1: YAML Syntax
      - name: Set up yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint .

      # CHECK 2: Kubernetes Schema Validation
      - name: Set up kubeconform
        run: |
          KUBEFORM_URL="https://github.com/yannh/kubeconform/releases/download"
          KUBEFORM_URL="${KUBEFORM_URL}/v0.6.6/kubeconform-linux-amd64.tar.gz"
          curl -fsSL "$KUBEFORM_URL" -o kubeconform.tar.gz
          tar xf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Run kubeconform with CRD schemas
        run: |
          DATREE_BASE="https://raw.githubusercontent.com/datreeio/CRDs-catalog/main"
          DATREE_SCHEMA="${DATREE_BASE}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

          CERTMGR_BASE="https://raw.githubusercontent.com/cert-manager/cert-manager/master/deploy/crds"
          CERTMGR_SCHEMA="${CERTMGR_BASE}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

          SEALED_BASE="https://raw.githubusercontent.com/bitnami-labs/sealed-secrets/main/helm/sealed-secrets/crds"
          SEALED_SCHEMA="${SEALED_BASE}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

          kubeconform \
            -strict \
            -summary \
            -output json \
            -schema-location default \
            -schema-location "${DATREE_SCHEMA}" \
            -schema-location "${CERTMGR_SCHEMA}" \
            -schema-location "${SEALED_SCHEMA}" \
            -ignore-filename-pattern "Chart.yaml" \
            -ignore-filename-pattern "values.yaml" \
            configs/

      # CHECK 3: Security Scan
      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
