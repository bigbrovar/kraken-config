---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mosquitto
  namespace: argocd
  finalizers:
    - resources-finalizer.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "50"
spec:
  project: default

  sources:
    # Source 1: OCI Chart from Bitnami (via Docker Hub)
    # ArgoCD will automatically use the dockerhub-bitnami secret
    # based on matching repoURL
    - repoURL: 'registry-1.docker.io/bitnamicharts'
      chart: mosquitto
      targetRevision: 4.22.2
      helm:
        valueFiles:
          - $values/configs/energy/mosquitto/values.yaml

    # Source 2: Your Git Repo (values.yaml)
    - repoURL: 'https://github.com/bigbrovar/kraken-config.git'
      targetRevision: HEAD
      ref: values

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: energy

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /status/loadBalancer
