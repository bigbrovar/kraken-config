---
# Traefik is the cluster's ingress controller. It replaced ingress-nginx,
# which was retired upstream in March 2026, and holds the address all
# *.homelab.org.ng names resolve to.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "30"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 42.4.1
    helm:
      valuesObject:
        deployment:
          replicas: 2

        ingressClass:
          enabled: true
          isDefaultClass: true
          name: traefik

        providers:
          kubernetesIngress:
            enabled: true
            # Write Traefik's LoadBalancer IP into each Ingress status
            publishedService:
              enabled: true
          kubernetesCRD:
            enabled: true  # Middleware / IngressRouteTCP, needed later for ArgoCD
          kubernetesGateway:
            enabled: false

        ports:
          web:
            # Replaces the nginx force-ssl-redirect annotation for every host
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true

        service:
          # LoadBalancer is the chart default. Chart 42.x rejects an explicit
          # `type` key here.
          annotations:
            # The address pfSense resolves *.homelab.org.ng to. Pinned so it
            # can never drift.
            metallb.universe.tf/loadBalancerIPs: 172.42.1.10
          spec:
            externalTrafficPolicy: Local

        ingressRoute:
          dashboard:
            enabled: false

        additionalArguments:
          # Traefik stops reading a request after 60s by default, which would
          # cut large uploads (Longhorn backing images, Kavita books).
          - --entryPoints.websecure.transport.respondingTimeouts.readTimeout=3600s

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - traefik
                  topologyKey: kubernetes.io/hostname
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: traefik
  ignoreDifferences:
    - group: ""
      kind: Service
      name: traefik
      jsonPointers:
        - /status/loadBalancer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 5m
