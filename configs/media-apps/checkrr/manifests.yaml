---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: checkrr-data
  namespace: media
  labels:
    app: checkrr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkrr-config
  namespace: media
data:
  checkrr.yaml: |
    checkrr:
      # Added Movies-2 and TV-Series-2 to the scan list
      rootdir: ["/media/Movies", "/media/Movies-2", "/media/TV-Series", "/media/TV-Series-2"]
      checkpath: []
      database: /data/checkrr.db
      debug: false
      csvfile: /data/checkrr.csv
      logfile: /data/checkrr.log

    process:
      ffmpeg: true
      hash: false

    webserver:
      port: 8585
      trustedproxies: ["0.0.0.0/0"]

    # URLs are defined here, but keys are injected via Env Vars below
    sonarr:
      - url: http://sonarr:8989
        tag_label: "corrupt"

    radarr:
      - url: http://radarr:7878
        tag_label: "corrupt"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkrr
  namespace: media
  labels:
    app: checkrr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: checkrr
  template:
    metadata:
      labels:
        app: checkrr
    spec:
      securityContext:
        fsGroup: 1000

      containers:
        - name: checkrr
          image: ghcr.io/aetaric/checkrr:latest
          imagePullPolicy: IfNotPresent

          # Standard hardening (Safe for Go apps)
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL

          env:
            - name: TZ
              value: "Africa/Lagos"

            # SECURE INJECTION (Overrides config file)
            # This specific syntax overrides config file settings:
            # CHECKRR__<SECTION>__<INDEX>__<KEY>

            # Override sonarr[0].apikey
            - name: CHECKRR__SONARR__0__APIKEY
              valueFrom:
                secretKeyRef:
                  name: checkrr-secrets
                  key: sonarr-apikey

            # Override radarr[0].apikey
            - name: CHECKRR__RADARR__0__APIKEY
              valueFrom:
                secretKeyRef:
                  name: checkrr-secrets
                  key: radarr-apikey

          ports:
            - name: http
              containerPort: 8585
              protocol: TCP

          volumeMounts:
            - name: config
              mountPath: /etc/checkrr.yaml
              subPath: checkrr.yaml
              readOnly: true
            - name: data
              mountPath: /data
            - name: media
              mountPath: /media
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache

          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi

          # Startup probe: 30 mins is generous but safe for big DB initializations
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: config
          configMap:
            name: checkrr-config
        - name: data
          persistentVolumeClaim:
            claimName: checkrr-data
        - name: media
          persistentVolumeClaim:
            claimName: media-root-pvc
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir:
            sizeLimit: 2Gi

---
apiVersion: v1
kind: Service
metadata:
  name: checkrr
  namespace: media
  labels:
    app: checkrr
spec:
  type: ClusterIP
  selector:
    app: checkrr
  ports:
    - name: http
      port: 8585
      targetPort: http
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkrr
  namespace: media
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/issuer: "null"
    cert-manager.io/cluster-issuer: "null"
    # Increase timeouts for long-running scans
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - checkrr.homelab.org.ng
      secretName: wildcard-homelab-tls
  rules:
    - host: checkrr.homelab.org.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: checkrr
                port:
                  name: http
