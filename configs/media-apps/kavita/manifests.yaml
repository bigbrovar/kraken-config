---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kavita-config
  namespace: media
  labels:
    app: kavita
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kavita
  namespace: media
  labels:
    app: kavita
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kavita
  template:
    metadata:
      labels:
        app: kavita
    spec:
      # Pod-level security context with fsGroup
      securityContext:
        fsGroup: 1000  # Makes volumes owned by gid 1000

      containers:
        - name: kavita
          image: lscr.io/linuxserver/kavita:latest
          imagePullPolicy: Always

          # Minimal container security context - let s6-overlay handle user switching
          securityContext:
            readOnlyRootFilesystem: false  # s6-overlay needs to write
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID
                - DAC_OVERRIDE

          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Africa/Lagos"

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          volumeMounts:
            - name: config
              mountPath: /config
            # Performance: Ephemeral cache on fast local disk
            - name: cache
              mountPath: /config/cache
            - name: media
              mountPath: /media
              readOnly: true
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi

          # Startup probe for initial library scan
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60

          # Liveness probe
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness probe
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: kavita-config
        - name: media
          persistentVolumeClaim:
            claimName: media-root-pvc
        # Ephemeral cache
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: kavita
  namespace: media
  labels:
    app: kavita
spec:
  type: ClusterIP
  selector:
    app: kavita
  ports:
    - name: http
      port: 5000
      targetPort: http
      protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kavita
  namespace: media
  labels:
    app: kavita
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/issuer: "null"
    cert-manager.io/cluster-issuer: "null"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - books.homelab.org.ng
      secretName: wildcard-homelab-tls
  rules:
    - host: books.homelab.org.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kavita
                port:
                  name: http
