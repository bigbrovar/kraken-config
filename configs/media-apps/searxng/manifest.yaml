---
# Redis for SearXNG limiter and caching
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng-redis
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng-redis
  template:
    metadata:
      labels:
        app: searxng-redis
    spec:
      containers:
        - name: redis
          image: valkey/valkey:7-alpine
          ports:
            - containerPort: 6379
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: searxng-redis
  namespace: media
spec:
  selector:
    app: searxng-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      enableServiceLinks: false
      initContainers:
        - name: copy-settings
          image: busybox
          command:
            - sh
            - -c
            - cp /config/settings.yml /etc/searxng/settings.yml && chmod 644 /etc/searxng/settings.yml
          volumeMounts:
            - name: settings-configmap
              mountPath: /config
            - name: settings-writable
              mountPath: /etc/searxng
      containers:
        - name: searxng
          image: searxng/searxng:latest
          ports:
            - containerPort: 8080
          env:
            - name: SEARXNG_BASE_URL
              value: "https://search.homelab.org.ng"
            - name: SEARXNG_REDIS_URL
              value: "redis://searxng-redis:6379/0"
          envFrom:
            - secretRef:
                name: searxng-secrets
          volumeMounts:
            - name: settings-writable
              mountPath: /etc/searxng
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: settings-configmap
          configMap:
            name: searxng-settings
        - name: settings-writable
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: media
spec:
  selector:
    app: searxng
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: searxng
  namespace: media
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/issuer: "null"
    cert-manager.io/cluster-issuer: "null"
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  tls:
    - secretName: wildcard-homelab-tls
      hosts:
        - search.homelab.org.ng
  rules:
    - host: search.homelab.org.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: searxng
                port:
                  number: 8080
