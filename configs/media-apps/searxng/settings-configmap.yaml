---
apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: media
data:
  settings.yml: |
    use_default_settings: true

    search:
      safe_search: 0
      autocomplete: "google"
      default_lang: "en"

    server:
      port: 8080
      bind_address: "0.0.0.0"
      secret_key: ""  # Set from env
      limiter: true
      image_proxy: true

    ui:
      default_theme: simple
      theme_args:
        simple_style: dark

    # Increase timeouts to fix engine timeouts
    outgoing:
      request_timeout: 10.0
      max_request_timeout: 20.0

    # Configure engines
    engines:
      # Enable reliable engines
      - name: google
        disabled: false
        weight: 1

      - name: duckduckgo
        disabled: false
        weight: 1

      - name: bing
        disabled: false
        weight: 0.8

      - name: startpage
        disabled: false
        weight: 0.9
        timeout: 10.0

      - name: qwant
        disabled: false
        weight: 0.7

      - name: wikipedia
        disabled: false
        weight: 1.0

      - name: github
        disabled: false
        weight: 1.0

      # Disable problematic engines
      - name: yahoo
        disabled: true

      - name: yahoo news
        disabled: true

      - name: brave news
        disabled: true

      - name: reddit
        disabled: true

      - name: lemmy posts
        disabled: true

      - name: mastodon users
        disabled: true
