---
# ArgoCD's server speaks HTTPS with its own self-signed certificate, so it
# is exposed with a Traefik IngressRoute: TLS ends at Traefik with the
# wildcard certificate, then Traefik connects to argocd-server over HTTPS
# without verifying its internal certificate.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: argocd-server-https
  namespace: argocd
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: argocd
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`argo.homelab.org.ng`)
      middlewares:
        - name: security-headers
      services:
        - name: argocd-server
          port: 443
          scheme: https
          serversTransport: argocd-server-https
  tls:
    secretName: wildcard-homelab-tls
