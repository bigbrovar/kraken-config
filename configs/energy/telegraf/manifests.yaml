---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telegraf-config
  namespace: energy
data:
  telegraf.conf: |
    [agent]
      interval = "10s"
      round_interval = true
      metric_batch_size = 1000
      metric_buffer_limit = 10000
      collection_jitter = "0s"
      flush_interval = "10s"
      flush_jitter = "0s"
      precision = ""
      debug = false
      quiet = false
      hostname = "k3s-telegraf"
      omit_hostname = false

    [[outputs.influxdb_v2]]
      urls = ["http://influxdb.energy.svc.cluster.local:8086"]
      token = "$INFLUX_TOKEN"
      organization = "homelab"
      bucket = "solar"

    [[inputs.mqtt_consumer]]
      servers = ["tcp://mosquitto.energy.svc.cluster.local:1883"]

      topics = [
        "helio/#"
      ]

      username = "$MQTT_USERNAME"
      password = "$MQTT_PASSWORD"

      data_format = "value"
      data_type = "float"

      [inputs.mqtt_consumer.tags]
        source = "victron"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegraf
  namespace: energy
  labels:
    app: telegraf
spec:
  replicas: 1
  # One MQTT consumer at a time: two pods with the same client would keep
  # disconnecting each other during a rolling update.
  strategy:
    type: Recreate
    # Needed when switching an existing Deployment from RollingUpdate:
    # the API rejects Recreate while the old rollingUpdate settings remain.
    rollingUpdate: null
  selector:
    matchLabels:
      app: telegraf
  template:
    metadata:
      labels:
        app: telegraf
    spec:
      containers:
        - name: telegraf
          image: telegraf:1.29

          env:
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegraf-secrets
                  key: influx-token
            - name: MQTT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: telegraf-secrets
                  key: mqtt-username
            - name: MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telegraf-secrets
                  key: mqtt-password

          # Usage observed at about 170Mi (2026-11); headroom for the
          # buffer that fills while InfluxDB is restarting.
          resources:
            requests:
              memory: "192Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          volumeMounts:
            - name: config
              mountPath: /etc/telegraf/telegraf.conf
              subPath: telegraf.conf
              readOnly: true

          # No liveness probe on purpose. The previous one ran `telegraf --test`
          # every 30s, which starts a second Telegraf and never checks the
          # running one. If Telegraf exits, Kubernetes restarts it anyway.

      volumes:
        - name: config
          configMap:
            name: telegraf-config
