# Cloudflare Tunnel connector. It dials out to Cloudflare, so no port is opened at home.
# The tunnel token comes from the SealedSecret "rana-secrets" (key: tunnel-token).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rana-cloudflared
  namespace: energy
  labels:
    app: rana-cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rana-cloudflared
  template:
    metadata:
      labels:
        app: rana-cloudflared
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: cloudflared
          # A fixed version, so a restart never pulls in a release nobody has looked at.
          # To update: pick a version from the cloudflared releases page and change it here.
          image: cloudflare/cloudflared:2026.11.2
          # Said outright: the Deployment was first made with the "latest" tag, which left
          # it on "Always". A restart during a DNS or internet outage then failed to pull an
          # image the node already had.
          imagePullPolicy: IfNotPresent
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rana-secrets
                  key: tunnel-token
          # /ready answers 503 whenever the tunnel to Cloudflare is down. That is the right
          # test for "can this pod take traffic", and the wrong one for "is this pod broken":
          # during an internet outage it had the pod restarted, which cannot fix the internet.
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
            periodSeconds: 10
          # Alive means the process is running and listening. It reconnects by itself.
          livenessProbe:
            tcpSocket:
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
