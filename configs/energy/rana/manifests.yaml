# Rana: read-only solar dashboard.
#
# Secrets come from the SealedSecret "rana-secrets" in configs/sealed-secrets/
# (keys: influx-token, tunnel-token). See deploy/README.md in the rana repo.
#
# Two ways in:
#   rana.homelab.org.ng      home network only, through the Ingress at the bottom
#   rana.openculture.org.ng  the internet, through the Cloudflare Tunnel, which points
#                            at the Service and is subject to the limits and human check
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rana
  namespace: energy
  labels:
    app: rana
spec:
  # Two copies, so one restart, one crash or one node going down is not an outage.
  # Each copy keeps its own short-lived answers and counts its own per-visitor limits.
  # The human-check pass is signed with the shared secret, so it is good on both.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: rana
  template:
    metadata:
      labels:
        app: rana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Put the two copies on different nodes when possible.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: rana
      # Prefer the x86 nodes. The Raspberry Pis are a fallback: the image runs on both, but
      # a year-long energy query is several times slower on a Pi.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values: ["amd64"]
      containers:
        - name: rana
          image: ghcr.io/bigbrovar/rana:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # Node's own memory ceiling, kept well under the container limit below, so it
            # tidies up in good time and is never killed for memory by the cluster.
            - name: NODE_OPTIONS
              value: "--max-old-space-size=256"
            # Talk to InfluxDB inside the cluster instead of going out through the public name.
            - name: INFLUX_URL
              value: http://influxdb.energy.svc.cluster.local:8086
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rana-secrets
                  key: influx-token
            # Human check (Cloudflare Turnstile) in front of zoom and Stats for geeks.
            # The site key is public. Leave it empty to switch the check off.
            - name: TURNSTILE_SITE_KEY
              value: "0x4AAAAAAGFA4up-W1l8uUIP"
            # The home address below is served by the cluster's own ingress and is
            # treated as trusted: no human check and no per-visitor limits.
            - name: TRUSTED_HOSTS
              value: rana.homelab.org.ng
            - name: TURNSTILE_SECRET
              valueFrom:
                secretKeyRef:
                  name: rana-secrets
                  key: turnstile-secret
                  optional: true
          # /healthz does no work of its own, so a slow answer means the server is stuck.
          # The limits are generous all the same: a busy moment on a slow node must not be
          # mistaken for a hang, which is how the restart loop of 2026-11-19 kept going.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: rana
  namespace: energy
  labels:
    app: rana
spec:
  type: ClusterIP
  selector:
    app: rana
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Home network only. pfSense resolves this name to the cluster's ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rana
  namespace: energy
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd
    # Live updates are one long-running connection. Do not buffer it or cut it short.
    # DOUBLE-LOCK: Stop cert-manager from overwriting the secret
    cert-manager.io/issuer: "null"
    cert-manager.io/cluster-issuer: "null"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - rana.homelab.org.ng
      secretName: wildcard-homelab-tls
  rules:
    - host: rana.homelab.org.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rana
                port:
                  name: http
