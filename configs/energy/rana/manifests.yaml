# Rana: read-only solar dashboard.
#
# Secrets come from the SealedSecret "rana-secrets" in configs/sealed-secrets/
# (keys: influx-token, tunnel-token). See deploy/README.md in the rana repo.
#
# Two ways in:
#   rana.homelab.org.ng      home network only, through the Ingress at the bottom
#   rana.openculture.org.ng  the internet, through the Cloudflare Tunnel, which points
#                            at the Service and is subject to the limits and human check
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rana
  namespace: energy
  labels:
    app: rana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rana
  template:
    metadata:
      labels:
        app: rana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rana
          image: ghcr.io/bigbrovar/rana:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # Talk to InfluxDB inside the cluster instead of going out through the public name.
            - name: INFLUX_URL
              value: http://influxdb.energy.svc.cluster.local:8086
            - name: INFLUX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rana-secrets
                  key: influx-token
            # Human check (Cloudflare Turnstile) in front of zoom and Stats for geeks.
            # The site key is public. Leave it empty to switch the check off.
            - name: TURNSTILE_SITE_KEY
              value: "0x4AAAAAAGFA4up-W1l8uUIP"
            # The home address below is served by the cluster's own ingress and is
            # treated as trusted: no human check and no per-visitor limits.
            - name: TRUSTED_HOSTS
              value: rana.homelab.org.ng
            - name: TURNSTILE_SECRET
              valueFrom:
                secretKeyRef:
                  name: rana-secrets
                  key: turnstile-secret
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: rana
  namespace: energy
  labels:
    app: rana
spec:
  type: ClusterIP
  selector:
    app: rana
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Home network only. pfSense resolves this name to the cluster's ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rana
  namespace: energy
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd
    # Live updates are one long-running connection. Do not buffer it or cut it short.
    # DOUBLE-LOCK: Stop cert-manager from overwriting the secret
    cert-manager.io/issuer: "null"
    cert-manager.io/cluster-issuer: "null"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - rana.homelab.org.ng
      secretName: wildcard-homelab-tls
  rules:
    - host: rana.homelab.org.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rana
                port:
                  name: http
