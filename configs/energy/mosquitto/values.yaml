---
mosquitto:
  image:
    tag: 2.0.20

  # Security: Authentication via Sealed Secret
  # This relies on the 'mosquitto-auth' secret being deployed by your sealed-secrets app
  auth:
    enabled: true
    existingPasswordSecret: mosquitto-auth

  # Networking: Static IP via MetalLB
  service:
    type: LoadBalancer
    annotations:
      metallb.universe.tf/loadBalancerIPs: 172.42.1.200
    ports:
      mqtt: 1883
      mqtts: 8883

  # Security: TLS via Reflected Wildcard Cert
  # Reflector copies 'wildcard-homelab-tls' to the 'energy' namespace automatically
  tls:
    enabled: true
    autoGenerated: false
    existingSecret: wildcard-homelab-tls

  # Persistence
  persistence:
    enabled: true
    storageClass: longhorn
    size: 1Gi
