---
# 1. ConfigMap: Mosquitto configuration, mounted as-is.
# Credentials are not in here: users come from the password file in the
# mosquitto-auth secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: energy
data:
  mosquitto.conf: |
    # Persistence
    persistence true
    persistence_location /mosquitto/data/
    persistent_client_expiration 7d
    log_dest stdout

    # Authentication
    password_file /mosquitto/auth/password_file
    allow_anonymous false

    # Listener 1: MQTTS (Secure) - Port 8883
    listener 8883
    protocol mqtt
    keyfile /mosquitto/certs/tls.key
    certfile /mosquitto/certs/tls.crt
    require_certificate false

    # Listener 2: MQTT (Insecure/Local) - Port 1883
    listener 1883
    protocol mqtt

---
# 2. PVC: Persistent Data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data
  namespace: energy
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi

---
# 3. Deployment: The Application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: energy
  labels:
    app: mosquitto
spec:
  replicas: 1
  # The data volume is ReadWriteOnce: the old pod must stop before the new
  # one starts, or a rollout can hang waiting for the volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      securityContext:
        fsGroup: 1883

      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0
          ports:
            - containerPort: 8883
              name: mqtts
            - containerPort: 1883
              name: mqtt
          # Usage observed at about 550Mi (2026-11). The limit protects the
          # node if the broker's message queue grows without bound.
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            # The config has no secrets or variables in it, so it is mounted
            # straight from the ConfigMap.
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: data
              mountPath: /mosquitto/data
            - name: certs
              mountPath: /mosquitto/certs
              readOnly: true
            - name: auth
              mountPath: /mosquitto/auth
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data
        - name: auth
          secret:
            secretName: mosquitto-auth
        - name: certs
          secret:
            secretName: wildcard-homelab-tls

---
# 4. Service: Expose via MetalLB (Static IP)
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: energy
  annotations:
    metallb.universe.tf/loadBalancerIPs: 172.42.1.200
spec:
  type: LoadBalancer
  selector:
    app: mosquitto
  ports:
    - name: mqtts
      port: 8883
      targetPort: 8883
      protocol: TCP
    - name: mqtt
      port: 1883
      targetPort: 1883
      protocol: TCP
