---
# 1. ConfigMap: Mosquitto Configuration TEMPLATE
# We use a template so we can inject secrets (remote user/pass) at runtime
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: energy
data:
  mosquitto.conf.template: |
    # Persistence
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout

    # Authentication
    password_file /mosquitto/auth/password_file
    allow_anonymous false

    # Listener 1: MQTTS (Secure) - Port 8883
    listener 8883
    protocol mqtt
    keyfile /mosquitto/certs/tls.key
    certfile /mosquitto/certs/tls.crt
    require_certificate false

    # Listener 2: MQTT (Insecure/Local) - Port 1883
    listener 1883
    protocol mqtt

    # -----------------------------------------------------------------
    # MQTT Bridging Configuration
    # -----------------------------------------------------------------
    connection openculture-bridge
    address ${REMOTE_ADDRESS}

    # Topic mapping: Forward 'helio/#' locally to 'helio/#' remotely
    topic helio/# out 1

    # Remote Authentication (Injected)
    remote_username ${REMOTE_USERNAME}
    remote_password ${REMOTE_PASSWORD}

    # Bridge TLS settings (Required for port 8883)
    bridge_capath /etc/ssl/certs

---
# 2. PVC: Persistent Data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mosquitto-data
  namespace: energy
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi

---
# 3. Deployment: The Application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: energy
  labels:
    app: mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mosquitto
  template:
    metadata:
      labels:
        app: mosquitto
    spec:
      securityContext:
        fsGroup: 1883

      # Init Container: Reads template + secrets -> writes final config
      initContainers:
        - name: config-generator
          image: alpine:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              sed -e "s|\${REMOTE_ADDRESS}|$REMOTE_ADDRESS|g" \
                  -e "s|\${REMOTE_USERNAME}|$REMOTE_USERNAME|g" \
                  -e "s|\${REMOTE_PASSWORD}|$REMOTE_PASSWORD|g" \
                  /config-template/mosquitto.conf.template > /config-generated/mosquitto.conf
          env:
            - name: REMOTE_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: mosquitto-auth
                  key: remote_address
            - name: REMOTE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mosquitto-auth
                  key: remote_username
            - name: REMOTE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosquitto-auth
                  key: remote_password
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config-generated
              mountPath: /config-generated

      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0
          ports:
            - containerPort: 8883
              name: mqtts
            - containerPort: 1883
              name: mqtt
          volumeMounts:
            # Mount the GENERATED config from the shared volume
            - name: config-generated
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
            - name: data
              mountPath: /mosquitto/data
            - name: certs
              mountPath: /mosquitto/certs
              readOnly: true
            - name: auth
              mountPath: /mosquitto/auth
              readOnly: true
      volumes:
        - name: config-template
          configMap:
            name: mosquitto-config
        # EmptyDir to share generated config between Init and Main container
        - name: config-generated
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: mosquitto-data
        - name: auth
          secret:
            secretName: mosquitto-auth
        - name: certs
          secret:
            secretName: wildcard-homelab-tls

---
# 4. Service: Expose via MetalLB (Static IP)
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: energy
  annotations:
    metallb.universe.tf/loadBalancerIPs: 172.42.1.200
spec:
  type: LoadBalancer
  selector:
    app: mosquitto
  ports:
    - name: mqtts
      port: 8883
      targetPort: 8883
      protocol: TCP
    - name: mqtt
      port: 1883
      targetPort: 1883
      protocol: TCP
