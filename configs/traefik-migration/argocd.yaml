---
# ArgoCD's server speaks HTTPS with its own self-signed certificate.
# nginx talked to it over HTTPS without checking that certificate
# (backend-protocol: HTTPS). A plain Ingress cannot express that in
# Traefik, so ArgoCD uses an IngressRoute plus a ServersTransport.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: argocd-server
  namespace: argocd
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hsts
  namespace: argocd
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server-traefik
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`argo.homelab.org.ng`)
      middlewares:
        - name: hsts
      services:
        - name: argocd-server
          port: 443
          scheme: https
          serversTransport: argocd-server
  tls:
    secretName: wildcard-homelab-tls
