---
# Traefik has no request body size limit by default (nginx needed 10000m).
# Long uploads rely on the websecure readTimeout set in the traefik app.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ingress-traefik
  namespace: longhorn-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-hsts@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - secretName: wildcard-homelab-tls
      hosts:
        - longhorn.homelab.org.ng
  rules:
    - host: longhorn.homelab.org.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
