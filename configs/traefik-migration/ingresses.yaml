---
# Traefik copies of every nginx Ingress, used to test each app through
# Traefik (172.42.1.11) before the cutover. Same hosts, same backends.
# The nginx Ingresses are untouched and DNS still points at 172.42.1.10.
#
# At cutover this whole folder is deleted and each app's own Ingress
# switches to `ingressClassName: traefik`.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: influxdb-traefik
  namespace: energy
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-hsts@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - secretName: wildcard-homelab-tls
      hosts:
        - influxdb.homelab.org.ng
  rules:
    - host: influxdb.homelab.org.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: influxdb
                port:
                  name: http
---
# Rana streams live data. Traefik does not buffer responses, so the nginx
# proxy-buffering/read-timeout annotations have no equivalent to set.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rana-traefik
  namespace: energy
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-hsts@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - secretName: wildcard-homelab-tls
      hosts:
        - rana.homelab.org.ng
  rules:
    - host: rana.homelab.org.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rana
                port:
                  name: http
