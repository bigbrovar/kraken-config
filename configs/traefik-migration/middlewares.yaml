---
# nginx sent a Strict-Transport-Security header on every HTTPS response.
# Traefik does not by default, so this keeps the behaviour identical.
# Referenced from Ingress annotations as `traefik-hsts@kubernetescrd`.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hsts
  namespace: traefik
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
---
# Replaces nginx.ingress.kubernetes.io/limit-rps: "10" on SearXNG.
# Referenced as `media-searxng-ratelimit@kubernetescrd`.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: searxng-ratelimit
  namespace: media
spec:
  rateLimit:
    average: 10
    burst: 20
