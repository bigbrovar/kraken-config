---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ingress
  namespace: longhorn-system
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik-security-headers@kubernetescrd
    # Increase body size for large volume backups/restores via UI
    cert-manager.io/issuer: "null"
    cert-manager.io/cluster-issuer: "null"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - longhorn.homelab.org.ng
      secretName: wildcard-homelab-tls
  rules:
    - host: longhorn.homelab.org.ng
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
